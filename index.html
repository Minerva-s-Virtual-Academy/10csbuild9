<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secondary Storage Mastery - iGCSE Computer Science</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Development builds with full error logs) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel Standalone (Transpiles JSX right in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Note type="text/babel" which allows Babel to parse the JSX code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [timeLeft, setTimeLeft] = useState(1500);
      const [timerActive, setTimerActive] = useState(false);
      const [activeTab, setActiveTab] = useState('welcome');
      const [stats, setStats] = useState({ totalPoints: 0 });

      useEffect(() => {
        let interval = null;
        if (timerActive && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (timeLeft === 0) {
          setTimerActive(false);
        }
        return () => clearInterval(interval);
      }, [timerActive, timeLeft]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      return (
        <div class="max-w-5xl mx-auto p-6">
          <header class="border-b border-cyan-800 pb-4 mb-6 flex justify-between items-center">
            <div>
              <h1 class="text-3xl font-bold text-cyan-400">Secondary Storage Mastery</h1>
              <p class="text-slate-400 text-sm">Edexcel iGCSE CS (Topic 4.2.5 & 4.2.6)</p>
            </div>
            <div class="flex items-center space-x-4 bg-slate-900 p-3 rounded-lg border border-slate-800">
              <span class="text-2xl font-mono text-cyan-300">{formatTime(timeLeft)}</span>
              <button 
                onClick={() => setTimerActive(!timerActive)}
                class="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-medium text-sm transition"
              >
                {timerActive ? 'Pause' : 'Start Timer'}
              </button>
            </div>
          </header>

          <main class="bg-slate-900 p-6 rounded-xl border border-slate-800">
            <h2 class="text-xl font-semibold text-cyan-300 mb-2">Welcome Students!</h2>
            <p class="text-slate-300 mb-4">Complete your 25-minute pre-learning tasks using the single-file template.</p>
          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
